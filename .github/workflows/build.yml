name: Build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

jobs:
  linux:
    name: Linux (AppImage)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libxxf86vm-dev libasound2-dev libfuse2

      - name: Build raylib (static)
        run: |
          git clone --depth 1 --branch 5.5 https://github.com/raysan5/raylib.git
          cmake -S raylib -B raylib/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_EXAMPLES=OFF \
            -DCMAKE_INSTALL_PREFIX="$PWD/raylib/install"
          cmake --build raylib/build --config Release --target install -j"$(nproc)"
          echo "RAYLIB_DIR=$PWD/raylib/install" >> "$GITHUB_ENV"

      - name: Build game
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DRAYLIB_DIR="$RAYLIB_DIR"
          cmake --build build -j"$(nproc)"

      - name: Assemble AppDir
        run: |
          mkdir -p AppDir/usr/bin \
                   AppDir/usr/share/applications \
                   AppDir/usr/share/icons/hicolor/256x256/apps
          cp build/snowboard_rush AppDir/usr/bin/
          cp -r build/assets AppDir/usr/bin/assets
          cp packaging/linux/snowboard-rush.desktop AppDir/usr/share/applications/
          cp packaging/linux/snowboard-rush.desktop AppDir/
          cp assets/icon.png AppDir/usr/share/icons/hicolor/256x256/apps/snowboard-rush.png
          cp assets/icon.png AppDir/snowboard-rush.png
          cp packaging/linux/AppRun AppDir/AppRun
          chmod +x AppDir/AppRun AppDir/usr/bin/snowboard_rush

      - name: Build AppImage
        env:
          ARCH: x86_64
        run: |
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ./appimagetool-x86_64.AppImage --no-appstream AppDir Snowboard_Rush-x86_64.AppImage

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: Snowboard_Rush-Linux-x86_64.AppImage
          path: Snowboard_Rush-x86_64.AppImage

  windows:
    name: Windows (x86_64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-mingw-w64-x86-64 zip

      - name: Download raylib (MinGW)
        run: |
          wget -q https://github.com/raysan5/raylib/releases/download/5.5/raylib-5.5_win64_mingw-w64.zip
          unzip -q raylib-5.5_win64_mingw-w64.zip
          echo "RAYLIB_DIR=$PWD/raylib-5.5_win64_mingw-w64" >> "$GITHUB_ENV"

      - name: Build game
        run: |
          cmake -S . -B build \
            -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/mingw-w64-x86_64.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DRAYLIB_DIR="$RAYLIB_DIR"
          cmake --build build -j"$(nproc)"

      - name: Package zip
        run: |
          cd build
          zip -r ../Snowboard_Rush-Windows-x86_64.zip snowboard_rush.exe assets/

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: Snowboard_Rush-Windows-x86_64.zip
          path: Snowboard_Rush-Windows-x86_64.zip
